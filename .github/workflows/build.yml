name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (incl. JUCE FetchContent + vendored SPU core)
        run: cmake --build build --config Release
      - name: List build artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Include *.vst3,*.dll,*.exe |
            Select-Object FullName, Length |
            Format-Table -AutoSize

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        # Canonical JUCE Linux build deps. juce_gui_extra needs GTK 3 +
        # WebKit even when JUCE_WEB_BROWSER=0; juce_graphics needs
        # freetype + fontconfig; juce_audio_devices needs ALSA + JACK.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j2
      - name: List build artifacts
        if: always()
        run: find build -name '*.vst3' -o -name '*.so' | head -20
